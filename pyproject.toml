[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-elo"
version = "0.1.0"
description = "Analyse historical T20I cricket matches using an Elo rating system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]